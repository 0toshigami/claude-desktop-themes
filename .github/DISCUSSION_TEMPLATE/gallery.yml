title: "[Gallery] "
body:
  - type: markdown
    attributes:
      value: |
        Share a theme or wallpaper you made for Claude Desktop.

        **Do not paste or attach wallpaper scene code (`.js`) here.** A scene runs on the logged-in Claude page, so scene code goes in a pull request, where it can be reviewed. You can still show the wallpaper here with a preview.
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Simple theme (.json and optional .css)
        - Live wallpaper (preview only)
    validations:
      required: true
  - type: textarea
    id: preview
    attributes:
      label: Preview
      description: Drop in a screenshot, GIF or short video. Check that it shows nothing private from your chats.
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Idea or prompt
      description: What inspired it? If you used make-theme, what did you ask for?
  - type: textarea
    id: files
    attributes:
      label: Theme files
      description: Simple themes only. Paste the .json and .css contents in code blocks.
      placeholder: Leave this empty for a live wallpaper.
